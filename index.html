<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="app">

    <h1>Tic Tac Toe</h1>

    <!-- Game Controls -->
    <section class="controls">

        <div class="modes">

            <label>
                <input type="radio" name="mode" value="pvp" checked>
                2 Players
            </label>

            <label>
                <input type="radio" name="mode" value="pve">
                Play vs AI
            </label>

        </div>

        <div class="buttons">
            <button id="rematchBtn">Rematch</button>
            <button id="resetBtn">Reset</button>
        </div>

    </section>


    <!-- Game Board -->
    <div id="board" class="board" aria-label="Tic Tac Toe board">

        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>

        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>

        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>

    </div>


    <!-- Game Status -->
    <div class="status">
        <p id="message">Player X's turn</p>
    </div>


    <!-- Scoreboard -->
    <section class="scoreboard">

        <h2>Scoreboard</h2>

        <div class="scores">

            <div>
                X:
                <span id="scoreX">0</span>
            </div>

            <div>
                O:
                <span id="scoreO">0</span>
            </div>

            <div>
                Draws:
                <span id="scoreDraws">0</span>
            </div>

        </div>

    </section>


    <footer class="credits">
        Built with vanilla HTML, CSS &amp; JS
    </footer>

</main>


<script src="script.js"></script>

</body>
</html>
